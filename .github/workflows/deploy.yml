name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare deploy folder
        run: rm -rf dist && mkdir dist

      - name: Build mlops-south-bay-2026
        run: |
          cd slides/mlops-south-bay-2026
          npm install
          npx slidev build --base /conference-talks/mlops-south-bay-2026/ --out ../../dist/mlops-south-bay-2026

      - name: Build sample-talk
        run: |
          cd slides/sample-talk
          npm install
          npx slidev build --base /conference-talks/sample-talk/ --out ../../dist/sample-talk

      - name: Create index page
        run: |
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Union Conference Talks</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                box-sizing: border-box;
              }
              .container {
                background: white;
                border-radius: 12px;
                padding: 2rem;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
              }
              h1 {
                color: #333;
                margin-bottom: 0.5rem;
              }
              p.subtitle {
                color: #666;
                margin-top: 0;
                margin-bottom: 2rem;
              }
              ul {
                list-style: none;
                padding: 0;
              }
              li {
                margin: 1rem 0;
              }
              a {
                display: block;
                padding: 1rem 1.5rem;
                background: #f8f9fa;
                border-radius: 8px;
                color: #667eea;
                text-decoration: none;
                font-weight: 500;
                transition: all 0.2s ease;
              }
              a:hover {
                background: #667eea;
                color: white;
                transform: translateX(5px);
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Union Conference Talks</h1>
              <p class="subtitle">Presentations by Union.ai</p>
              <ul>
                <li><a href="mlops-south-bay-2026/">MLOps South Bay 2026</a></li>
                <li><a href="sample-talk/">Sample Talk</a></li>
              </ul>
            </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
